# ---------------------------------------------------------------------------
# All the words on the site live in this one file.
#
# You can edit it here if you like YAML, but the friendlier way is the CMS at
# app.pagescms.org, which shows every field below as a labelled box. Either way
# the result is the same, and the live site updates about a minute after saving.
#
# Two rules if you edit this file by hand:
#   1. Keep the indentation exactly as it is. YAML cares about spaces.
#   2. If your text contains a colon or starts with a quote, wrap the whole
#      thing in "double quotes".
#
# Leaving a field empty is fine and often deliberate — the page hides the bits
# that have nothing in them yet, rather than showing an empty gap.
# ---------------------------------------------------------------------------

hero:
  # One sentence. The hook. This is the line people remember.
  logline: A new play about who gets to be well, and what it costs everybody else.
  # Short version of the venue for the strip under the title. Leave blank until confirmed.
  venue_short: ""
  # e.g. "12–30 May 2027". Leave blank and it reads "To be announced".
  dates_short: ""
  # e.g. "90 minutes, no interval"
  running_time: ""
  status: In production

synopsis:
  # The sharpest line of the play, or a distillation of its argument.
  pull_quote: A pull-quote goes here. One line, sharp enough to stop someone scrolling.

  # The synopsis itself. Blank lines separate paragraphs. **Bold** and *italics* work.
  body: |
    **Paragraph one.** Set the situation up — who, where, and what has just gone
    wrong. Keep it present tense and concrete. This is the paragraph a programmer
    or a journalist will read and nothing else, so it has to carry the whole play.

    Paragraph two. Turn the screw. What choice is forced, and what does it cost?
    Avoid summarising the ending — leave the question open.

    Paragraph three, optional. What the play is really about underneath the plot,
    said once and lightly.

  # Content warnings. Leave blank to hide the box entirely.
  content_note: ""

