synopsis:
  body: |
    Ten year old Simonetta wants to be an actress. She’s happy and bright – until the day a man follows her home from school. As she grows up, her chest and her stomach begin to burn and her jaw bleeds. She looks for answers, but the doctors say she’s fine. Her employers tell her to take some pills.

    HEALTH IS A PRIVILEGE is a one-woman play about invisible pain. A dark comedy humming with quiet rage, Health is a Privilege will make you laugh out loud at inappropriate moments and offer solace to anyone who has ever sought help and been told there’s nothing wrong with them.

    With an original score and live music from guitarist Jack Martyn-Hillier.
