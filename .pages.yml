# Pages CMS configuration — https://pagescms.org/docs/
#
# This file decides what the editing form at app.pagescms.org looks like. Each
# field below becomes a labelled box, and each `description` becomes the grey
# hint underneath it. Changing this file changes the form, not the website.

media:
  input: Pics
  output: /Pics
  categories: [image]

content:
  - name: play
    label: Website content
    type: file
    path: _data/play.yml
    format: yaml
    fields:

      # ---------------------------------------------------------------
      - name: nav
        label: Navigation
        type: object
        fields:
          - name: cta
            label: Ticket button label
            type: string
            description: The link at the top right. It points at the box office once there is one, and at the dates section until then.

      # ---------------------------------------------------------------
      - name: hero
        label: Top of the page
        type: object
        fields:
          - name: background
            label: Background image
            type: image
            description: Fills the whole first screen behind the title. It is dimmed automatically, so pick something with a clear middle. Leave empty for plain black.
          - name: byline
            label: Byline
            type: string
            description: Sits above the handwritten title. e.g. One woman show by Simonetta Gibejova.
          - name: tagline
            label: Tagline
            type: text
            description: The line under the handwritten title. Set in capitals by the design, so type it normally.
          - name: venue_short
            label: Venue (short)
            type: string
            description: Just the venue name, for the strip under the title. Leave empty until it's public.
          - name: dates_short
            label: Dates (short)
            type: string
            description: e.g. 12–30 May 2027. Leave empty and it reads "To be announced".
          - name: running_time
            label: Running time
            type: string
            description: e.g. 90 minutes, no interval. Leave empty to hide it.
          - name: status
            label: Status
            type: string
            description: e.g. In production, In rehearsal, Now playing.

      # ---------------------------------------------------------------
      - name: synopsis
        label: The play
        type: object
        fields:
          - name: body
            label: Synopsis
            type: rich-text
            description: Shown on the second screen, over the photograph. Keep it short — a long synopsis will crowd the image.
          - name: content_note
            label: Content note
            type: text
            description: Content warnings. Leave empty and the box disappears.

      # ---------------------------------------------------------------
      - name: about
        label: Simonetta
        type: object
        description: The biography section.
        fields:
          - name: name
            label: Name
            type: string
          - name: portrait
            label: Portrait
            type: image
          - name: portrait_alt
            label: Portrait description
            type: string
            description: For people using a screen reader — describe the photograph.
          - name: body
            label: Biography
            type: rich-text

      # ---------------------------------------------------------------
      - name: accolade
        label: Award / accolade
        type: object
        description: A full-width band between the synopsis and the second photograph. Leave the headline empty and the whole band disappears.
        fields:
          - name: text
            label: Headline
            type: text
            description: e.g. Winner, Best Costume Design. Keep it to one line.
          - name: detail
            label: Small print above it
            type: string
            description: e.g. Warwick Film Festival, 2025.

      # ---------------------------------------------------------------
      - name: cast
        label: Cast
        type: object
        list: true
        description: One entry per role. Drag to reorder.
        fields:
          - name: role
            label: Character
            type: string
          - name: name
            label: Played by
            type: string
            description: Leave empty and it shows "Casting to be announced".
          - name: bio
            label: Short bio
            type: text
            description: A line or two. Recent credits, training — whatever gives a booker confidence.

      # ---------------------------------------------------------------
      - name: creatives
        label: Creative team
        type: object
        list: true
        description: Writer, director, designers and so on. Drag to reorder.
        fields:
          - name: role
            label: Job
            type: string
          - name: name
            label: Name
            type: string
          - name: bio
            label: Short bio
            type: text

      # ---------------------------------------------------------------
      - name: tickets
        label: Dates & tickets
        type: object
        fields:
          - name: venue_name
            label: Venue name
            type: string
          - name: venue_address
            label: Venue address
            type: string
          - name: venue_url
            label: Venue website
            type: string
            description: Full address starting https://. Shown in the footer.
          - name: dates_text
            label: Performance dates
            type: text
            description: Write it however reads best. Leave empty and it says "To be announced."
          - name: onsale_text
            label: On-sale note
            type: text
          - name: mailing_list_url
            label: Mailing list link
            type: string
            description: "A signup page starting https://, or a mailto: link. Empty hides the button."
          - name: booking_url
            label: Box office link
            type: string
            description: Leave empty until tickets are actually on sale — the Book tickets button stays hidden until there's a link here.
          - name: groups_email
            label: Group bookings email
            type: string

      # ---------------------------------------------------------------
      - name: press
        label: Gallery & press
        type: object
        fields:
          - name: gallery
            label: Production images
            type: object
            list: true
            description: The first two also appear full-screen between sections, so put your strongest images first. Three across looks best in the grid, but any number works.
            fields:
              - name: image
                label: Image
                type: image
              - name: caption
                label: Caption
                type: string
              - name: alt
                label: Image description
                type: string
                description: For people using a screen reader — describe what's happening in the photo.
          - name: quotes
            label: Press quotes
            type: object
            list: true
            description: Real review quotes only, once the play has been seen. Empty until then — the section hides itself.
            fields:
              - name: quote
                label: Quote
                type: text
                description: No quotation marks — the design adds those.
              - name: publication
                label: Publication
                type: string
          - name: kit_text
            label: Press pack note
            type: text
          - name: email
            label: Press email
            type: string

      # ---------------------------------------------------------------
      - name: contact
        label: Contact
        type: object
        fields:
          - name: general_email
            label: General email
            type: string
          - name: press_email
            label: Press email
            type: string
          - name: instagram_url
            label: Instagram
            type: string
            description: Full address starting https://. Empty hides the link.

      # ---------------------------------------------------------------
      - name: seo
        label: Search & sharing
        type: object
        description: How the site looks in Google results and when the link is pasted into WhatsApp or Instagram.
        fields:
          - name: allow_search
            label: Allow Google to find the site
            type: boolean
            description: Off while the copy is still placeholder. Turn on when you're happy for the site to appear in search results — it can take Google a few days to notice either way.
          - name: meta_description
            label: Google description
            type: text
            description: Around 155 characters. This is the grey text under the link in search results.
          - name: share_description
            label: Link preview text
            type: text
          - name: share_image
            label: Link preview image
            type: image
            description: Ideally 1200 × 630 pixels. Without one, shared links show no picture.

settings:
  content:
    merge: true
